services:
  - type: web
    name: accessibility-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # IMPORTANT: Add GROQ_API_KEY manually in Render Dashboard. Do NOT commit it here.
